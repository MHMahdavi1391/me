<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>محمد حسین مهدوی | بنیان‌گذار DNI CO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="محمد حسین مهدوی - بنیان‌گذار DNI CO، فعال در طراحی سایت، فیلمبرداری، عکاسی و تولید محتوای حرفه‌ای">
  <meta name="keywords" content="محمد حسین مهدوی, portfolio, طراحی سایت, فیلمبردار, عکاس, تولید محتوا">
  
  <!-- فونت زیبای فارسی -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- آیکون‌ها -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- دکمه تغییر زبان ثابت -->
  <button id="lang-switch" aria-label="تغییر زبان">
    <span>EN</span>
  </button>

  <!-- هدر -->
  <header id="header">
    <div class="header-container">
      <h1 id="site-name" class="fade-in"></h1>
      <p id="tagline" class="tagline"></p>
    </div>
  </header>

  <!-- بخش اصلی -->
  <main class="fade-in">
    <!-- Hero Section -->
    <section id="hero" class="hero-section">
      <!-- Hero content توسط JS پر می‌شود -->
    </section>

    <!-- بخش توضیحات -->
    <section class="intro-section">
      <div class="intro-card" id="intro-card-1">
        <i class="fas fa-laptop-code"></i>
        <h2 id="intro-title-1"></h2>
        <p id="intro-text-1"></p>
      </div>
      <div class="intro-card" id="intro-card-2">
        <i class="fas fa-video"></i>
        <h2 id="intro-title-2"></h2>
        <p id="intro-text-2"></p>
      </div>
      <div class="intro-card" id="intro-card-3">
        <i class="fas fa-camera"></i>
        <h2 id="intro-title-3"></h2>
        <p id="intro-text-3"></p>
      </div>
    </section>

    <!-- گالری پروژه‌ها -->
    <section class="gallery-section">
      <div class="section-header">
        <h2 id="gallery-title"><i class="fas fa-images"></i></h2>
        <p id="gallery-subtitle"></p>
      </div>
      <div id="gallery" class="gallery-grid">
        <!-- کارت‌ها توسط JS ساخته می‌شوند -->
      </div>
    </section>
  </main>

  <!-- فوتر -->
  <footer id="footer" class="fade-in">
    <div class="footer-content">
      <p id="footer-text"></p>
      <p class="copyright">© 2024 محمد حسین مهدوی. تمامی حقوق محفوظ است.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
